<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GoalPath</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <!-- =========================
       AUTH SCREEN
  ========================== -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="logo.svg" alt="GoalPath" class="auth-logo">
        <h1>GoalPath</h1>
        <p>Track habits, hit targets, build streaks.</p>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <!-- LOGIN -->
      <form id="login-form" class="tab-panel active" data-panel="login">
        <label class="label">Email</label>
        <input class="input" type="email" id="login-email" required placeholder="you@email.com"/>

        <label class="label">Password</label>
        <input class="input" type="password" id="login-password" required placeholder="••••••••"/>

        <button class="btn btn-primary w-full" type="submit">Login</button>

        <button class="btn btn-secondary w-full" type="button" id="google-login-btn">
          Continue with Google
        </button>

        <button type="button" id="reset-password-btn" class="link-btn">
          Forgot password?
        </button>
      </form>

      <!-- REGISTER -->
      <form id="register-form" class="tab-panel" data-panel="register">
        <label class="label">Email</label>
        <input class="input" type="email" id="register-email" required placeholder="you@email.com"/>

        <label class="label">Password</label>
        <input class="input" type="password" id="register-password" required placeholder="Min 6 characters"/>

        <button class="btn btn-primary w-full" type="submit">Create account</button>

        <button class="btn btn-secondary w-full" type="button" id="google-register-btn">
          Sign up with Google
        </button>
      </form>

      <div id="auth-error" class="auth-error hidden"></div>
    </div>
  </div>

  <!-- =========================
       APP SHELL
  ========================== -->
  <div id="app" class="app hidden">

    <!-- HEADER -->
    <header class="header">
      <div class="container header-inner">
        <div class="brand">
          <img src="logo.svg" alt="GoalPath" class="brand-logo">
          <span class="brand-name">GoalPath</span>
        </div>

        <div class="header-actions">
          <button id="theme-toggle" class="icon-btn" title="Toggle theme">🌙</button>
          <button id="open-summary" class="icon-btn" title="Daily summary">📅</button>
          <button id="open-analytics" class="icon-btn" title="Analytics">📊</button>
          <button id="new-goal-btn" class="btn btn-primary">+ New Goal</button>
          <button id="logout-btn" class="btn btn-secondary">Logout</button>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="container main">

      <section class="stats" id="stats-grid"></section>

      <section class="toolbar card">
        <div class="toolbar-row">
          <input id="search-input" class="input" type="text" placeholder="Search goals..."/>

          <select id="filter-type" class="input">
            <option value="all">All types</option>
            <option value="habit">Habits</option>
            <option value="target">Targets</option>
          </select>

          <select id="filter-category" class="input">
            <option value="all">All categories</option>
            <option value="Health">Health</option>
            <option value="Career">Career</option>
            <option value="Fitness">Fitness</option>
            <option value="Study">Study</option>
            <option value="Personal">Personal</option>
          </select>

          <select id="filter-status" class="input">
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="archived">Archived</option>
            <option value="all">All</option>
          </select>
        </div>

        <div class="toolbar-row toolbar-row-2">
          <button id="undo-btn" class="btn btn-secondary" disabled>↩ Undo</button>
          <button id="export-btn" class="btn btn-secondary">Export JSON</button>
          <button id="install-btn" class="btn btn-secondary hidden">Install App</button>
        </div>
      </section>

      <section id="empty-state" class="card empty hidden">
        <img src="logo.svg" alt="" class="empty-logo">
        <h2>No goals yet</h2>
        <p>Create your first goal and start building momentum.</p>
        <button id="create-first-goal" class="btn btn-primary">Create Goal</button>
      </section>

      <section id="pinned-section" class="hidden">
        <h2 class="section-title">📌 Pinned</h2>
        <div id="pinned-list" class="space-y-4"></div>
      </section>

      <section id="active-section">
        <h2 class="section-title">Active Goals</h2>
        <div id="goals-list" class="space-y-4"></div>
      </section>

      <section id="completed-section" class="hidden">
        <h2 class="section-title">Completed Goals</h2>
        <div id="completed-list" class="space-y-4"></div>
      </section>

      <section id="archived-section" class="hidden">
        <h2 class="section-title">Archived</h2>
        <div id="archived-list" class="space-y-4"></div>
      </section>

      <div class="footer-space"></div>
    </main>
  </div>

  <!-- All Modals (unchanged) -->
  <!-- Your goal modal, increment modal, summary modal, analytics modal, calendar modal, confetti remain EXACTLY as you sent them -->

  <!-- Main Script -->
  <script type="module" src="script.js"></script>
</body>
</html>
